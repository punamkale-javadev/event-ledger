version: '3.8'

services:

  account-service:

    build:
      context: ./account-service

    container_name:
      account-service

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

  gateway-service:

    build:
      context: ./gateway-service

    container_name:
      gateway-service

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080
      ACCOUNT_SERVICE_URL:
        http://account-service:8081

    depends_on:
      - account-service